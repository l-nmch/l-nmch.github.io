baseURL: https://leo.nonnenmacher-logel.fr/
languageCode: fr
title: Léo Nonnenmacher
theme: ["PaperMod"]

caches:
  images:
    dir: :cacheDir/images

params:
  env: production
  description: "Mon Portfolio - https://github.com/l-nmch/portfolio"
  author: Léo Nonnenmacher

  defaultTheme: auto
  ShowReadingTime: true
  displayFullLangName: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true

  profileMode:
    enabled: True
    title: Léo Nonnenmacher
    imageUrl: "/pp.png"
