baseURL: https://leo.nonnenmacher-logel.fr/
title: Léo Nonnenmacher
theme: ["PaperMod"]

defaultContentLanguage: fr
defaultContentLanguageInSubdir: false
enableRobotsTXT: true

languages:
  fr:
    contentDir: content/fr
    languageCode: fr
    languageName: "Français"
    weight: 1
    params:
      description: "Mon Portfolio - https://github.com/l-nmch/portfolio"
      profileMode:
        subtitle: "Les ordures des uns font les mines d'or des autres — moi, en l'occurrence."
      ctaButtons:
        - name: Articles
          description: Mes inepties.
          url: posts
        - name: À propos
          description: Le coupable.
          url: about-me
      experience:
        - icon: "🎓"
          title: Formateur indépendant
          description: "Formations Linux, Cloud, DevOps et infrastructure, en école comme en entreprise."
        - icon: "📦"
          title: Négociant en matériel informatique
          description: "Achat, reconditionnement et revente de matériel décommissionné chez [Retake](https://retake.fr)."
        - icon: "☁️"
          title: Platform Engineer / MLOps
          description: "R&D, MCO et déploiement d'infrastructure Cloud / AI & ML chez [Cloudéo](https://cloudeo.fr)."
      footer:
        text: "[Mentions légales](/mentions-legales/) · [Confidentialité](/politique-de-confidentialite/)"
  en:
    contentDir: content/en
    languageCode: en
    languageName: "English"
    weight: 2
    params:
      description: "My Portfolio - https://github.com/l-nmch/portfolio"
      profileMode:
        subtitle: "One man's junk is another man's gold mine — mine, as it happens."
      ctaButtons:
        - name: Posts
          description: My nonsense.
          url: posts
        - name: About
          description: The culprit.
          url: about-me
      experience:
        - icon: "🎓"
          title: Independent trainer
          description: "Linux, Cloud, DevOps and infrastructure training, in schools and in companies."
        - icon: "📦"
          title: IT hardware reseller
          description: "Buying, refurbishing, and reselling decommissioned hardware at [Retake](https://retake.fr)."
        - icon: "☁️"
          title: Platform Engineer / MLOps
          description: "R&D, maintenance, and deployment of Cloud / AI & ML infrastructure at [Cloudéo](https://cloudeo.fr)."
      footer:
        text: "[Legal notice](/en/mentions-legales/) · [Privacy](/en/politique-de-confidentialite/)"

